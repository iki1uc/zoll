<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 USER · Markt-Prognose</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0d11;
      color: #c8d6e5;
      font-family: 'Consolas', monospace;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1100px;
      width: 100%;
    }
    h1 {
      color: #6cf;
      font-size: 2rem;
      text-shadow: 0 0 20px #3a6f9f88;
      margin-bottom: 6px;
    }
    .sub {
      color: #7a9bb5;
      margin-bottom: 30px;
      border-left: 3px solid #6cf;
      padding-left: 15px;
    }
    .panel {
      background: #11161e;
      border: 1px solid #2a3f4f;
      border-radius: 12px;
      padding: 22px 28px;
      margin-bottom: 24px;
    }
    .panel h2 {
      color: #9ac7e0;
      font-size: 1.2rem;
      margin-bottom: 12px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: #0c131c;
      border-radius: 8px;
      padding: 16px;
      border-left: 4px solid #3a6f9f;
    }
    .card .label {
      font-size: 0.7rem;
      color: #6a8fa0;
      text-transform: uppercase;
    }
    .card .value {
      font-size: 1.8rem;
      font-weight: bold;
      margin-top: 4px;
    }
    .btn {
      background: #1c2a36;
      border: 1px solid #3a5a6a;
      color: #e0f0fa;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s;
      margin: 4px 8px 4px 0;
    }
    .btn:hover {
      background: #2a4050;
      border-color: #6cf;
      box-shadow: 0 0 15px #2a6f9f55;
    }
    .btn-gold {
      background: #b8860b;
      border-color: #ffb347;
      color: #fff;
    }
    .btn-gold:hover {
      background: #d4a017;
      box-shadow: 0 0 20px #ffb34788;
    }
    .log-box {
      background: #0a1018;
      border-radius: 6px;
      padding: 10px 14px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 0.75rem;
      color: #9ab0c0;
      border: 1px solid #1a2a36;
      margin-top: 10px;
      white-space: pre-wrap;
    }
    .log-entry {
      border-bottom: 1px solid #1a222a;
      padding: 3px 0;
    }
    .log-info { color: #6cf; }
    .log-success { color: #6fdb6f; }
    .log-warning { color: #f0c060; }
    .log-error { color: #e06050; }
    @media (max-width: 700px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📊 USER · Markt‑Prognose</h1>
  <div class="sub">NC‑User‑Modul · RUN 3‑kompatibel · Respo‑Master</div>

  <!-- Dashboard -->
  <div class="panel">
    <h2>📈 Markt‑Dashboard</h2>
    <div class="grid-2" id="dashboard">
      <div class="card"><div class="label">Aktueller Kurs</div><div class="value" id="kurs">—</div></div>
      <div class="card"><div class="label">Trend</div><div class="value" id="trend">—</div></div>
      <div class="card"><div class="label">Volatilität</div><div class="value" id="vola">—</div></div>
      <div class="card"><div class="label">Prognose (24h)</div><div class="value" id="prognose">—</div></div>
    </div>
  </div>

  <!-- Steuerung -->
  <div class="panel">
    <h2>🕹️ User‑Controls</h2>
    <button class="btn" id="btnUpdate">🔄 Update</button>
    <button class="btn" id="btnPredict">🔮 Prognose starten</button>
    <button class="btn btn-gold" id="btnReport">📡 Report senden</button>
  </div>

  <!-- Log -->
  <div class="panel">
    <h2>📝 Log</h2>
    <div class="log-box" id="logBox"></div>
  </div>
</div>

<script type="module">
  // ================================================================
  // 1. Respo-Master importieren (REORG-Version)
  // ================================================================
  import { report, autoReport, getGlobalStatus, onUpdate } from './respo-master.js';

  // ================================================================
  // 2. State
  // ================================================================
  const state = {
    kurs: 100,
    trend: 'neutral',
    vola: 0.05,
    prognose: 0,
    timestamp: Date.now(),
  };

  // ================================================================
  // 3. DOM-Helfer
  // ================================================================
  const $ = id => document.getElementById(id);

  // ================================================================
  // 4. Log-Funktion
  // ================================================================
  function log(msg, type = 'info') {
    const box = $('logBox');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const time = new Date().toLocaleTimeString();
    const icon = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '❌' }[type] || '📌';
    entry.innerHTML = `<span class="log-${type}">[${time}] ${icon} ${msg}</span>`;
    box.appendChild(entry);
    box.scrollTop = box.scrollHeight;
  }

  // ================================================================
  // 5. Markt-Simulation (Prognose-Algorithmus)
  // ================================================================
  function simulateMarket() {
    const change = (Math.random() - 0.5) * 6;
    state.kurs = Math.max(10, Math.round((state.kurs + change) * 100) / 100);
    state.trend = change > 1 ? '🚀 steigend' : change < -1 ? '📉 fallend' : '➡️ seitwärts';
    state.vola = Math.round((0.02 + Math.random() * 0.08) * 1000) / 1000;
    state.prognose = Math.round((state.kurs * (1 + (Math.random() - 0.5) * 0.1)) * 100) / 100;
    state.timestamp = Date.now();
    updateUI();
    log(`📊 Markt aktualisiert: Kurs ${state.kurs}, Trend ${state.trend}`, 'info');
  }

  // ================================================================
  // 6. UI-Update
  // ================================================================
  function updateUI() {
    $('kurs').textContent = state.kurs + ' €';
    $('trend').textContent = state.trend;
    $('vola').textContent = (state.vola * 100).toFixed(1) + '%';
    $('prognose').textContent = state.prognose + ' €';
  }

  // ================================================================
  // 7. Report an Respo-Master
  // ================================================================
  function getUserPayload() {
    return {
      kurs: state.kurs,
      trend: state.trend,
      vola: state.vola,
      prognose: state.prognose,
      timestamp: state.timestamp,
    };
  }

  // Automatisches Melden alle 5s
  autoReport('USER', getUserPayload, 5000);

  // Manueller Report
  $('btnReport').addEventListener('click', () => {
    report('USER', getUserPayload());
    log('📡 Report gesendet', 'success');
  });

  // ================================================================
  // 8. Live-Updates von anderen Modulen empfangen
  // ================================================================
  onUpdate((data) => {
    if (data.name === 'FOUNDER') {
      log(`👑 Founder-Status: ${data.payload.running ? 'läuft' : 'gestoppt'}`, 'info');
    } else if (data.name === 'NC_MOVE') {
      log(`🌀 MOVE-Energie: ${data.payload.totalEnergy || '?'}`, 'info');
    } else if (data.name === 'WETTER') {
      log(`🌤️ Wetter: ${data.payload.orbitMode || '?'}`, 'info');
    } else if (data.name === 'SOCCER') {
      log(`⚽ Soccer: ${data.payload.leader || '?'}`, 'info');
    }
  });

  // ================================================================
  // 9. Event-Listener
  // ================================================================
  $('btnUpdate').addEventListener('click', simulateMarket);
  $('btnPredict').addEventListener('click', () => {
    // einfache Prognose-Berechnung
    const trendFactor = state.trend.includes('steigend') ? 1.02 : state.trend.includes('fallend') ? 0.98 : 1.0;
    const prediction = Math.round(state.kurs * trendFactor * (1 + (Math.random() - 0.5) * 0.05) * 100) / 100;
    state.prognose = prediction;
    updateUI();
    log(`🔮 Prognose berechnet: ${prediction} €`, 'success');
  });

  // ================================================================
  // 10. Initialisierung
  // ================================================================
  simulateMarket();
  log('📊 USER-Modul gestartet', 'success');

  // Respo-Master initial abfragen, um bestehende Module zu sehen
  setTimeout(() => {
    const status = getGlobalStatus();
    if (status.modules && Object.keys(status.modules).length > 0) {
      log(`📡 Gefundene Module: ${Object.keys(status.modules).join(', ')}`, 'info');
    }
  }, 1000);
</script>
</body>
</html>
